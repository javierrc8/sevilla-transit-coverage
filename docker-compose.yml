version: "3.9"

services:
  # Sustituto local de Snowflake. Actúa como staging warehouse para dbt.
  # Se documenta en el README cómo se adaptaría el código de staging a Snowflake en producción.
  postgres:
    image: postgres:16
    container_name: sevilla_transit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sevilla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevilla}
      POSTGRES_DB: ${POSTGRES_DB:-sevilla_transit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sevilla}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Placeholder: Airflow se añadirá en la Fase 4 (webserver + scheduler + metadata db)
  # Placeholder: Streamlit se añadirá en la Fase 5

volumes:
  postgres_data: